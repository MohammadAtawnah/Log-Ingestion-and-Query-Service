name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit & Integration tests
        run: npm test

  contract-test-no-auth:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for service to be healthy
        run: |
          echo "Waiting for service to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/health | grep -q "ok"; then
              echo "Service is healthy!"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 2
          done

      - name: Test GET /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          if [ "$STATUS" != "200" ]; then echo "FAIL: /health returned $STATUS"; exit 1; fi
          echo "PASS: GET /health"

      - name: Test POST /logs (ingest)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/logs \
            -H "Content-Type: application/json" \
            -d '{"logs":[{"timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","service":"ci-test","message":"smoke test","attributes":{"test":"true"}}]}')
          STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          if [ "$STATUS" != "200" ]; then echo "FAIL: POST /logs returned $STATUS: $BODY"; exit 1; fi
          echo "PASS: POST /logs - $BODY"

      - name: Test GET /logs (query)
        run: |
          sleep 2
          RESPONSE=$(curl -s -w "\n%{http_code}" "http://localhost:8080/logs?service=ci-test")
          STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          if [ "$STATUS" != "200" ]; then echo "FAIL: GET /logs returned $STATUS: $BODY"; exit 1; fi
          echo "PASS: GET /logs - $BODY"

      - name: Test GET /logs/aggregate
        run: |
          SINCE=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-1H +%Y-%m-%dT%H:%M:%SZ)
          UNTIL=$(date -u -d '1 hour' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v+1H +%Y-%m-%dT%H:%M:%SZ)
          RESPONSE=$(curl -s -w "\n%{http_code}" "http://localhost:8080/logs/aggregate?since=${SINCE}&until=${UNTIL}&bucket=1h")
          STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          if [ "$STATUS" != "200" ]; then echo "FAIL: GET /logs/aggregate returned $STATUS: $BODY"; exit 1; fi
          echo "PASS: GET /logs/aggregate - $BODY"

      - name: Stop services
        if: always()
        run: docker compose down -v

  contract-test-with-auth:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Start services with auth
        run: |
          AUTH_ENABLED=true LOADGEN_API_KEY=test-key-12345 docker compose up -d --build

      - name: Wait for service to be healthy
        run: |
          echo "Waiting for service to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/health | grep -q "ok"; then
              echo "Service is healthy!"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 2
          done

      - name: Test health is unauthenticated
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          if [ "$STATUS" != "200" ]; then echo "FAIL: /health should not require auth, got $STATUS"; exit 1; fi
          echo "PASS: GET /health (no auth required)"

      - name: Test endpoints reject without token
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/logs)
          if [ "$STATUS" != "401" ]; then echo "FAIL: GET /logs without auth should return 401, got $STATUS"; exit 1; fi
          echo "PASS: GET /logs returns 401 without auth"

      - name: Test endpoints accept with bearer token
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer test-key-12345" http://localhost:8080/logs)
          if [ "$STATUS" != "200" ]; then echo "FAIL: GET /logs with valid auth should return 200, got $STATUS"; exit 1; fi
          echo "PASS: GET /logs with Bearer token"

      - name: Test POST /logs with auth
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/logs \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer test-key-12345" \
            -d '{"logs":[{"timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","level":"info","service":"ci-test","message":"auth smoke test"}]}')
          if [ "$STATUS" != "200" ]; then echo "FAIL: POST /logs with auth returned $STATUS"; exit 1; fi
          echo "PASS: POST /logs with auth"

      - name: Stop services
        if: always()
        run: docker compose down -v
